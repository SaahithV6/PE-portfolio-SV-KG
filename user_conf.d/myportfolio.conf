# Rate-limit POST /api/timeline_post to 1 request per minute per IP.
# Empty key for non-POST means those requests are not limited.
map $request_method $limit_timeline {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $limit_timeline zone=timeline:10m rate=1r/m;

server {
    listen 80;
    server_name saahithv6.duckdns.org;

    if ($host = saahithv6.duckdns.org) {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name saahithv6.duckdns.org;

    location /api/timeline_post {
        limit_req zone=timeline;
        limit_req_status 429;
        proxy_pass http://myportfolio:5000;
    }

    location / {
        proxy_pass http://myportfolio:5000/;
    }

    # Load the certificate files.
    ssl_certificate /etc/letsencrypt/live/myportfolio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myportfolio/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/myportfolio/chain.pem;
}
